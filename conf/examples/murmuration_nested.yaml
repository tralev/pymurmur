# ═══════════════════════════════════════════════════════════════════════
# murmuration_nested.yaml — HAND-MAINTAINED FIELD REFERENCE (not a preset)
# ═══════════════════════════════════════════════════════════════════════
# STATUS: NOT LOADABLE — deliberately outside the conf/*.yaml glob (see
# test/l4_system/test_config_files.py's CONF_DIR.glob("*.yaml")) so it
# can never be selected via --config or --list-configs.
#
# PURPOSE: one place listing every SimConfig field, grouped by
# sub-config section, with inline documentation. Within each section,
# keys drop that sub-config's name prefix (e.g. `vicsek: {couplage:
# ...}` for VicsekConfig.vicsek_couplage) purely for readability here —
# this is NOT the on-disk YAML vocabulary real presets use. For a
# loadable, exhaustively-commented example, see conf/murmuration.yaml
# or any other conf/*.yaml preset — those already group settings by
# section the same way the real loader expects (see arch.md §10 for
# the full preset table).
#
# NOT COVERED BY AUTOMATED TESTS: unlike every conf/*.yaml preset
# (validated end-to-end by test_config_files.py), nothing loads or
# checks this file, so it can silently drift when
# pymurmur/core/config/config_sections.py changes. Re-verify it by
# hand against that file during doc reviews.
#
# Values below are the dataclass defaults (Pearce projection baseline)
# unless noted. Sections for every mode/extension are always present —
# a config describes all of them; `mode:` selects which one runs
# (switchable live with M).
# ═══════════════════════════════════════════════════════════════════════

# ── Domain (static — requires restart) ──────────────────────────────
domain:
  width: 1000.0            # volume extent X
  height: 700.0             # volume extent Y
  depth: 400.0              # volume extent Z  (strictly 3D: must be > 0)

# ── Boundary ────────────────────────────────────────────────────────
boundary:
  mode: toroidal            # toroidal | open | margin | sphere | sphere_soft
  sphere_radius: 300.0      # sphere*: radius around the DOMAIN CENTRE
  avoidance_factor: 0.05    # margin/sphere push strength (μ)
  margin: 42.0              # margin mode: wall zone width (world units)
  radius_factor: 1.0        # sphere*: scales the effective containment radius

# ── Flock (static unless noted) ─────────────────────────────────────
# seed and velocity_init are direct SimConfig fields (never delegated
# to FlockConfig — see test/l2_integration/config_contract's IT6e),
# shown here at top level, not under flock:.
flock:
  num_boids: 150            # live-mutable via +/- and commands
  boid_size: 9.0             # body radius; unit for *_radius_bodies scaling
  v0: 4.0                    # cruise speed (live via PgUp/PgDn, floor 0.3)
  max_force: 0.15            # steering-force cap per frame
  visual_range: 70.0         # metric perception radius (hybrid filter gate)
  dt_phys: 0.01666667        # P8.10: fixed physics timestep (seconds, 1/60)
  speed_min_factor: 0.3      # band-mode floor as a fraction of v0
  n_predators: 0             # predator-species birds seated at array tail
  velocity_damping: 0.0      # general friction: v *= (1 - damping*dt), 0 = off

seed: 42                    # direct field: null = system entropy; int = deterministic replay
velocity_init: fixed        # direct field: fixed | cube | speed_uniform | tangential

# ── Active force mode ───────────────────────────────────────────────
mode: projection            # projection | spatial | field | vicsek |
                            # influencer | angle | marl   (M cycles registry)

# ── Pearce projection mode ──────────────────────────────────────────
projection:
  phi_p: 0.03               # projection weight (δ̂)          [live ↑↓]
  phi_a: 0.80                # alignment weight                [live ←→]
                             # φn = 1 − φp − φa (noise weight, derived)
  sigma: 4                   # topological neighbour count σ   [live [ ] ]
  max_visibility: 64          # occlusion candidate range cutoff
  max_occlusion_neighbors: 64 # visibility-sweep candidate cap
  heading_inertia: 0.0        # additive pull toward the bird's own current
                              # heading in v_desired, independent of phi_p+phi_a

# ── SI Refinements (Pearce SI-Appendix, U-key toggle) — its own
# RefinementConfig section, not part of projection: ────────────────
refinements:
  refinements: true          # master toggle                   [live U]
  steric: 0.6                # φ_s 1/d² repulsion strength (clamped to max_force)
  steric_radius: 10.0        # steric interaction cutoff distance
  steric_visible_only: false # restrict steric to occlusion-visible neighbors only
  blind_deg: 60.0             # rear blind cone full angle (degrees)
  anisotropy: 2.0             # prolate body axis ratio a/b (1.0 = isotropic)

# ── Reynolds spatial mode ───────────────────────────────────────────
spatial:
  separation_weight: 4.5     # live via HUD slider (1–5)
  alignment_weight: 0.65     # live via HUD slider (0–0.5 in Starlings regime)
  cohesion_weight: 0.75      # live via HUD slider (0–2)
  noise_scale: 0.0           # δ noise magnitude (0 = off)
  noise_mode: additive       # additive | maxwellian | none | seed_sinusoidal | velocity
  acceleration_scale: 0.3    # damping applied BEFORE the max_force clamp
  flow_weight: 0.0           # global flow contribution weight
  neighbor_filter: hybrid    # hybrid | metric | topological | global | none
  influence_count: 7         # hybrid-mode topological cap (Young 2013)
  # sum | mean | unit | exp | linear_ramp | asymptotic | velocity_weighted |
  # cosine_zone | linear | nearest_only | bell_zone
  separation_kernel: sum     # how sep forces are combined (kernel_registry.py)
  separation_kernel_radius: 20.0   # exp/linear_ramp/asymptotic/bell_zone (zone center)
  cohesion_kernel: unweighted      # unweighted | inverse_distance | bell_zone
  alignment_kernel: unweighted     # unweighted | fov_weighted | spherical_mean | bell_zone
  kernel_zone_width: 10.0     # bell_zone half-width (sep + cohesion + alignment)
  alignment_radius_ratio: 1.0 # dual-radii: alignment sees a tighter subset than sep/coh
                              # (1.0 = no extra restriction; starlings preset sets 0.75)
  separation_distance: 0.0    # absolute metric gate for separation neighbours (0 = off)
  # Per-interaction perception cones (0/-1 = disabled)
  max_dist_sep: 0.0
  max_dist_align: 0.0
  max_dist_coh: 0.0
  angle_sep: -1.0             # cos(θ) sep cone (−1 = full sphere)
  angle_align: -1.0           # cos(θ) align cone (−1 = full sphere)
  angle_coh: -1.0             # cos(θ) coh cone (−1 = full sphere)
  coherence_factor: 1.0       # reduce align/coh for small flocks (<1)
  w_fwd: 0.0                  # evolvable forward-thrust weight toward cruise speed
  # Obstacle avoidance (EvoFlock genes, consumed by _ObjectiveCollector)
  static_avoid_weight: 0.0
  predictive_avoid_weight: 0.0
  fly_away_max_dist: 0.0
  min_time_to_collide: 0.0
  # Species (predator boids)
  predator_speed_boost: 1.8        # species-mode multipliers
  predator_perception_boost: 1.5
  predator_accel_boost: 1.4
  predator_escape_factor: 1.0e7    # escape force replaces separation
  # Per-frame environmental weight wander (each independent — no master toggle)
  jitter_separation: 0.0     # 0 = off, 0.5 = ±50% variation
  jitter_cohesion: 0.0
  jitter_alignment: 0.0
  speed_mode: clamp          # clamp | band | none — how speed is enforced

# ── crs48 field/blob mode ───────────────────────────────────────────
field:
  unit_scale: 0.0            # 0 = auto 0.4·min(W,H,D); source-unit → world scale
  chase_strength: 0.72       # blob-field ↔ leader/chaser blend (the character knob)
  shell_influence: 1.0
  shell_radius_base: 0.22
  inner_radius_factor: 0.35
  target_pull: 0.35
  drift_pull: 0.55
  drift_direction: [0.0, 0.0, 0.0]  # zero vector = no directional bias
  tangent_pull: 1.0
  flow_pull: 1.0
  wave_gain: 0.5              # ripple/wave coupling
  ripple_trains: 3            # number of concurrent ripple wave-trains
  inertia: 0.8                # 0 = crisp speed clamp … 1 = pure direction steering
  separation: 0.92            # slot repulsion strength
  alignment: 0.90             # drift-alignment strength
  cohesion: 1.80               # shell pull strength
  flow: 0.30                   # curl-flow strength
  noise: 0.035                 # sinusoidal jitter (seed_noise3), distinct from speed_noise
  num_groups: 7                # leader/chaser group count
  leader_fraction: 0.16        # fraction of each group acting as leader
  disabled_terms: []           # names of field sub-terms to skip (e.g. ["shell"])

# ── Vicsek mode (collective-motion predator–prey) ───────────────────
vicsek:
  couplage: 0.8              # η alignment coupling ∈ [0,1]
  diffusion: 0.8              # D angular noise coefficient (√(2DΔt) amplitude)
  time_step: 0.1               # Δt in the noise amplitude (P1.8)
  velocity: 1.0                # constant prey speed (fixed speed mode)
  radius_influence: 5.0        # R_inf prey alignment radius
  radius_avoid: 1.0            # R_avoid same-type collision radius
  radius_predators: 80.0       # R_pred prey fear radius
  weight_afraid: 3.0           # neighbour-weight amplification while afraid
  predator_noise_ratio: 0.1    # predator noise = ratio × prey noise
  detect_ratio: 1.5            # hunting detection = ratio × R_pred
  velocity_predator: 2.0       # constant predator speed
  heading_inertia: 0.0         # additive pull toward the bird's prior heading,
                               # independent of the couplage/diffusion memory term

# ── murmuratR cosmic-influencer mode ────────────────────────────────
influencer:
  rank_exponent: 1.8          # influence gradient concavity (core/tail balance)
  substeps: 5                  # full move+steer+tick cycles per frame
  scale: 1.0                   # trajectory embedding multiplier
  influence_mode: rank         # rank (source behaviour) | distance
  near_dist_sq: 100.0          # distance-mode numerator (clamp(k/d², min, max))
  init_separation: 0.5         # density-scaled init spacing factor (N^{1/3}·sep)
  tick_rate: 1.0                # tick increment per substep
  # S2.E1: optional trajectory-shaping coefficients — default to the
  # verbatim spec Lissajous formula; overriding any of these reshapes
  # the target path without touching mode code.
  target_freq_primary: [97.0, 29.0, 41.0]
  target_freq_secondary: [217.0, 13.0, 7.0]
  target_amp_primary: [200.0, 200.0, 100.0]
  target_amp_secondary: [30.0, 30.0, 27.0]
  target_vert_offset: 40.0
  target_phase_offsets: [0.0, 53.0, 61.0]
  influence_min: 0.2            # distance-mode clip lower bound
  influence_max: 0.8            # distance-mode clip upper bound
  use_rank_override: false      # force rank-based influence regardless of influence_mode
  move_then_steer: true         # the only implemented update order (documents the contract)
  density_scaled_init: false    # auto-apply density-scaled Gaussian init for this mode
  pilot_enabled: false          # command-queue-driven pilot point replaces the Lissajous target
  pilot_speed: 40.0             # unit-scale U per second

# ── PyNBoids angle-steering mode ────────────────────────────────────
angle:
  turn_rate: 120.0            # deg/s base turn rate
  max_turn_rate: 200.0         # deg/s at the wall
  turn_threshold: 0.5          # deg dead-zone (anti-oscillation)
  jitter_deg: 4.0               # per-frame pre-steering heading jitter
  base_speed: 150.0             # world units/s
  neighbors: 7                  # ideal/maximum neighbour count
  sep_radius_bodies: 1.0        # mode-A flee threshold  = boid_size × this
  align_radius_bodies: 5.0      # mode-B align threshold = boid_size × this
  range_radius_bodies: 12.0     # neighbour cutoff  = boid_size × this
  speed_mode: linear            # linear | quadratic | softened
                                # (flat name is angle_speed_mode — "speed_mode"
                                # would collide with spatial's flat name)

# ── MARL bridge mode (external control; training stays external) ────
marl:
  action_scale: 0.05           # Δv per unit action (in velocity_cap units)
  velocity_cap: 0.5             # per-component speed cap (source units × U)
  rule_weight: 0.01             # deferred global-rule gain
  separation_radius: 2.0        # hard separation gate (source units × U)
  episode_steps: 500
  # S3.9: five-term penalty-composite reward weights (analysis/rl/rewards.py)
  reward_w_a: 1.0                # velocity_deviation weight
  reward_w_c: 1.0                # dispersion weight
  reward_w_L: 0.0                # angular-momentum penalty weight
  reward_w_b: 0.0                # boundary_overshoot weight
  reward_w_z: 0.0                # altitude_deviation weight

# ── Predator extension (crs48 FSM; live-toggleable; displayed as
# "Threat" in arch.md §7 — the dataclass/section is PredatorConfig) ──
predator:
  mode: autonomous              # off | cursor | orbit | autonomous   [live T]
  threat_radius: 12.0           # detection/flee radius
  strength: 1.0
  momentum: 0.5                  # pass-through momentum (turn-rate damping)
  acceleration: 0.8               # chase turn-rate contribution
  split_gain: 0.8                 # tangential tear force (the "hole")
  vacuole_strength: 0.0           # hollow-void push amplification
  blackening_gain: 0.6            # density-compression near the threat

# ── Ecology extension ────────────────────────────────────────────────
ecology:
  roost: [500.0, 350.0, 40.0]    # roost site (near-ground default)
  critical_mass: 500              # coherence-gate smoothstep centre
  dusk_width: 6.0                 # logistic dusk transition width (minutes)
  seasonal_amplitude: 0.5         # 0 = no season, 1 = full seasonal N modulation
  temperature_boost: 0.3          # temperature influence on roost pull
  predator_presence: deterministic # deterministic | stochastic

# ── Wander extension ─────────────────────────────────────────────────
wander:
  attractor_speed: 0.10           # boundedUnitTravel drift speed
  attractor_radius: 300.0         # attractor orbit radius

# ── SpeedNoise extension — organic slow/fast zones from a 3D noise
# field (distinct from field.noise, which is the unrelated sinusoidal
# jitter term) ────────────────────────────────────────────────────────
speed_noise:
  frequency: 0.003                # spatial frequency (cycles/unit)
  min_mult: 0.5                   # multiplier at noise sample 0.0
  max_mult: 2.0                   # multiplier at noise sample 1.0
  power: 1.0                      # shaping exponent before lerp
  time_scale: 0.0                 # 0 = static field; >0 = drifts over time

# ── NeighborAdaptiveSpeed extension — isolated boids fly faster,
# generalised across all 7 modes ───────────────────────────────────────
neighbor_adaptive_speed:
  target: 4                       # desired neighbor count
  radius: 70.0                    # query radius (~visual_range default)
  mode: linear                    # linear | quadratic | softened
  linear_scale: 5.0                # only used by "linear"

# ── DynamicVisionRange extension — flock-wide adaptive perception
# radius; only consumed by spatial + projection modes ─────────────────
dynamic_vision_range:
  ideal_count: 6.0                 # target average neighbor count
  step: 0.02                        # multiplier nudge per frame
  min_mult: 0.5
  max_mult: 2.0
  sample_k: 10                      # k-NN sample size for counting

# ── BoidStateMachine extension — generic, threshold-driven per-boid
# state (normal/isolated/crowded/threatened), first-match-wins priority
boid_state_machine:
  neighbor_radius: 70.0             # radius for counting neighbors
  sample_k: 10                       # k-NN sample size for counting
  isolated_neighbor_threshold: 2.0   # < this count -> isolated
  isolated_speed_mult: 1.3
  crowded_neighbor_threshold: 10.0   # > this count -> crowded
  crowded_speed_mult: 0.8
  threatened_proximity_threshold: 0.3  # ctx.threat_prox > this -> threatened
  threatened_speed_mult: 1.5

# ── Behavioural extension toggles (live-mutable) ─────────────────────
extensions:
  predator_enabled: false          # [live T]
  roosting_enabled: false          # [live K]
  wander_enabled: false
  ripple_enabled: false            # enveloped travelling density pulses
  speed_noise_enabled: false
  neighbor_adaptive_speed_enabled: false
  dynamic_vision_range_enabled: false
  boid_state_machine_enabled: false
  priority_stack_enabled: false    # tier1/2/3 obstacle/predator/mode budget allocation

# ── Metrics & physical calibration ──────────────────────────────────
metrics:
  detail_level: 1              # 0 = off | 1 = fast O(N) | 2 = + expensive/gated
  interval: 60                  # frames between expensive metrics / log lines
  bird_mass_kg: 0.075           # starling mass (physical-unit layer)
  cruise_speed_ms: 8.94         # real m/s mapped to v0
  acc_peak_ms2: 40.0            # real m/s² mapped to max_force

# ── Performance (mixes IndexConfig + PerfConfig fields, matching real
# presets' performance: section) ──────────────────────────────────────
performance:
  spatial_index: auto           # auto | hash_grid | kdtree | none
  topological_cap: 50           # cap on k-NN neighbor count
  use_toroidal_distance: true   # min-image neighbour queries under toroidal
  instance_buffer_chunk: 50000
  parallel_workers: 1           # n_jobs for occlusion culling (1 = sequential)
  target_fps: 60                # adaptive quality target frame rate
  history_cap: 10000            # max metrics history entries (ring buffer)
  use_numba: true                # enable numba JIT acceleration
  fastmath: false                # ONLY honoured when metrics.detail_level == 0
  num_threads: 0                 # numba threading (0 = auto)
  adaptive_quality: true         # adaptive quality governor
  readout_smooth: 0.04           # EMA factor for display-only smoothed readout (0=raw)

# ── Visualization (ignored with --no-viz) ───────────────────────────
viz:
  fps: 60
  window_width: 1200
  window_height: 800
  theme: ink                # ink | inverse | paper | graphite | heading
  per_bird_color: false     # per-bird HSV hue from seeds
  dual_view: false           # two simultaneous viewpoints (15/15 + 45/45)
  background_top: [0.05, 0.05, 0.15]     # sky top colour (RGB)
  background_bottom: [0.02, 0.02, 0.05]  # sky bottom colour (RGB)
  bird_mesh: auto             # auto | tetrahedron | winged | sphere
  point_sprites: false        # sphere impostors vs tetrahedra
  winged_mesh: true            # winged bird mesh vs tetrahedron
  flap_period: 0.35             # wing flap period (seconds)
  gradient_sky: true            # gradient sky background
  show_grid: false             # [live G]
  auto_rotate: false           # [live O]
  hud: true                     # slider panel + readout   [live TAB]
  trails: "off"                 # off | velocity | ring | accumulation | lines
  trail_length: 30               # trail history length / fade duration
  density_mode: false            # alpha-accumulation density (murmuratR aesthetic)
  density_alpha: 0.2              # sprite alpha in density mode

# ── Capture (used with --capture; env overrides CAPTURE_*) ──────────
capture:
  width: 800                # capture FBO resolution (NOT the domain — nested
  height: 600                #   schema makes that collision impossible)
  frames: 240
  every: 3                   # capture every Nth frame
  fps: 20                     # GIF playback speed
  output: output/murmuration.gif
  metrics_csv: output/metrics.csv
  metrics_json: output/metrics.json
  with_viz: true              # false = metrics-only capture
  sweep: true                  # cinematic camera sweep during capture
  scale: 1.0                   # distance scale factor for the sweep
  prewarm: 60                  # un-captured settle frames before recording
  mpl_fallback: true            # fall back to matplotlib when GPU capture fails
  mpl_dpi: 72                    # DPI for matplotlib fallback renders
  frame_cap: 10000                # ring-buffer cap for frames + metrics history
