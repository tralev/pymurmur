# conf/speed_models/speed_noise_modulated.yaml — spatial.speed_mode coverage reference
#
# One of 2 small presets in conf/speed_models/ closing out
# SPEED_MODEL_REGISTRY coverage (arch.md's "Other Computational
# Plugins" table) for the two strategies completing the comparison
# taxonomy's 6-strategy Speed Models list: noise_modulated (this file)
# and velocity_adaptive (speed_velocity_adaptive.yaml).
#
# This file demonstrates: spatial.speed_mode=noise_modulated — speed
# varies continuously with a deterministic 3D noise field sampled at
# each bird's position, producing organic slow/fast zones.
#
# Coverage/reference fixture, not tuned for visual character. Kept out
# of top-level conf/ (and so out of --list-configs) — same precedent as
# conf/kernels/, conf/filters/, conf/speed_laws/.

domain:
  width: 1000.0
  height: 700.0
  depth: 400.0

flock:
  num_boids: 100
  boid_size: 9.0
  v0: 4.0
  max_force: 0.15
  visual_range: 70.0

mode: spatial

spatial:
  separation_weight: 4.5
  alignment_weight: 0.65
  cohesion_weight: 0.75
  speed_mode: noise_modulated
  noise_mode: none

boundary_mode: toroidal

extensions:
  predator_enabled: false
  roosting_enabled: false
  wander_enabled: false
  ripple_enabled: false

performance:
  spatial_index: auto

metrics:
  detail_level: 1
  interval: 60

seed: 42
velocity_init: cube
position_init: grid
