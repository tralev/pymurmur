# conf/speed_models/speed_velocity_adaptive.yaml — spatial.speed_mode coverage reference
#
# Sibling of speed_noise_modulated.yaml — see that file's header for
# the shared rationale. This file demonstrates:
# spatial.speed_mode=velocity_adaptive — speed smoothly approaches a
# randomized-bonus target via exponential lerp rather than a hard
# clamp.
#
# Coverage/reference fixture, not tuned for visual character. Kept out
# of top-level conf/ (and so out of --list-configs) — same precedent as
# conf/kernels/, conf/filters/, conf/speed_laws/.

domain:
  width: 1000.0
  height: 700.0
  depth: 400.0

flock:
  num_boids: 100
  boid_size: 9.0
  v0: 4.0
  max_force: 0.15
  visual_range: 70.0

mode: spatial

spatial:
  separation_weight: 4.5
  alignment_weight: 0.65
  cohesion_weight: 0.75
  speed_mode: velocity_adaptive
  noise_mode: none

boundary_mode: toroidal

extensions:
  predator_enabled: false
  roosting_enabled: false
  wander_enabled: false
  ripple_enabled: false

performance:
  spatial_index: auto

metrics:
  detail_level: 1
  interval: 60

seed: 42
velocity_init: cube
position_init: grid
